name: Code Quality Checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  backend-lint:
    name: Backend - Python Linting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install flake8 black isort mypy django-stubs types-all

      - name: Run Flake8 (linting)
        run: |
          flake8 core/ pharmasys/ management/ \
            --max-line-length=88 \
            --extend-ignore=E203,W503 \
            --exclude=migrations/,staticfiles/,__pycache__ \
            --format='::error file=%(path)s,line=%(row)d,col=%(col)d::%(code)s %(text)s'
        continue-on-error: false

      - name: Check import sorting with isort
        run: |
          isort core/ pharmasys/ management/ \
            --profile=black \
            --line-length=88 \
            --check-only \
            --diff
        continue-on-error: false

      - name: Type check with mypy
        run: |
          mypy core/ pharmasys/ management/ \
            --ignore-missing-imports \
            --no-implicit-optional \
            2>&1 | tee mypy-report.txt
        continue-on-error: true

      - name: Upload mypy report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: mypy-report
          path: Backend/mypy-report.txt

      - name: Check for debug statements
        run: |
          echo "Checking for print() statements..."
          ! grep -r "^\s*print(" core/ pharmasys/ management/ \
            --include="*.py" \
            --exclude-dir=migrations \
            --exclude-dir=__pycache__ \
            -n 2>/dev/null | grep -v "LOG\|logger\|#" || (echo "Found debug print statements!" && exit 1)
          
          echo "Checking for breakpoint() statements..."
          ! grep -r "breakpoint(" core/ pharmasys/ management/ \
            --include="*.py" \
            --exclude-dir=migrations \
            --exclude-dir=__pycache__ \
            -n || (echo "Found breakpoint() statements!" && exit 1)

      - name: Check for hardcoded secrets
        run: |
          echo "Checking for hardcoded passwords/secrets..."
          ! grep -r "password\s*=" core/ pharmasys/ management/ \
            --include="*.py" \
            --exclude-dir=migrations \
            --exclude-dir=__pycache__ \
            -i -n 2>/dev/null | grep -v "MIN_PASSWORD\|PASSWORD_HASH\|PASSWORD_VALIDATORS\|#" || (echo "Found potential hardcoded secrets!" && exit 1)

      - name: Check formatting with Black
        run: |
          black core/ pharmasys/ management/ --line-length=88 --check --diff
        continue-on-error: true

  backend-tests:
    name: Backend - Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: test_pharmacy
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Django checks
        run: |
          python manage.py check
        env:
          DJANGO_SETTINGS_MODULE: pharmasys.settings_consolidated
          DEBUG: 'True'
          SECRET_KEY: test-secret-key
          ALLOWED_HOSTS: localhost,127.0.0.1

      - name: Run tests with pytest
        run: |
          pytest core/ -v --tb=short --no-header
        env:
          DJANGO_SETTINGS_MODULE: pharmasys.settings_consolidated
          DEBUG: 'True'
          SECRET_KEY: test-secret-key
          ALLOWED_HOSTS: localhost,127.0.0.1
          DATABASE_URL: postgres://test_user:test_password@localhost:5432/test_pharmacy
        continue-on-error: true

  frontend-lint:
    name: Frontend - ESLint & Prettier
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Check code formatting with Prettier
        run: npx prettier --check "src/**/*.{ts,tsx,js,jsx}"
        continue-on-error: true

      - name: Lint with ESLint
        run: npm run lint
        continue-on-error: true

      - name: Type check with TypeScript
        run: npx tsc --noEmit
        continue-on-error: true

  frontend-build:
    name: Frontend - Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Build frontend
        run: npm run build
        continue-on-error: true

  security:
    name: Security Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for .env file
        run: |
          if git diff HEAD~1 HEAD --name-only 2>/dev/null | grep -E "^\\.env($|\\.)" > /dev/null; then
            echo "ERROR: .env files must not be committed"
            exit 1
          fi
          echo "✓ No .env files in commit"

      - name: Check for private keys
        run: |
          if grep -r "PRIVATE KEY" . \
            --include="*.py" \
            --include="*.js" \
            --include="*.ts" \
            --include="*.env*" \
            --exclude-dir=node_modules \
            --exclude-dir=.venv \
            --exclude-dir=venv \
            --exclude-dir=.git \
            2>/dev/null; then
            echo "ERROR: Potential private keys found"
            exit 1
          fi
          echo "✓ No private keys detected"

      - name: Check for hardcoded secrets
        run: |
          if grep -r "password\s*=\s*['\"]" . \
            --include="*.py" \
            --include="*.js" \
            --include="*.ts" \
            --exclude-dir=node_modules \
            --exclude-dir=.venv \
            --exclude-dir=venv \
            --exclude-dir=.git \
            --exclude-dir=migrations \
            2>/dev/null | grep -v "PASSWORD_HASH\|PASSWORD_VALIDATORS\|#"; then
            echo "WARNING: Possible hardcoded secrets found (review above)"
          fi
          echo "✓ Secret check complete"

      - name: Check .gitignore
        run: |
          if [ ! -f .gitignore ]; then
            echo "ERROR: .gitignore file not found"
            exit 1
          fi
          if ! grep -q "^\\.env" .gitignore; then
            echo "ERROR: .env not in .gitignore"
            exit 1
          fi
          echo "✓ .gitignore properly configured"

  summary:
    name: Quality Checks Summary
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-tests, frontend-lint, frontend-build, security]
    if: always()

    steps:
      - name: Check job statuses
        run: |
          echo "Quality Checks Summary:"
          echo "======================"
          echo "Backend Lint:  ${{ needs.backend-lint.result }}"
          echo "Backend Tests: ${{ needs.backend-tests.result }}"
          echo "Frontend Lint: ${{ needs.frontend-lint.result }}"
          echo "Frontend Build: ${{ needs.frontend-build.result }}"
          echo "Security: ${{ needs.security.result }}"
          
          if [ "${{ needs.backend-lint.result }}" = "failure" ]; then
            echo "❌ Backend linting failed"
            exit 1
          fi
          
          if [ "${{ needs.security.result }}" = "failure" ]; then
            echo "❌ Security checks failed"
            exit 1
          fi
          
          echo ""
          echo "✅ All critical checks passed!"

      - name: Comment PR if failed
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ Code quality checks failed. Please review the logs and fix the issues.'
            })
