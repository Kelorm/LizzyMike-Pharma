<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LizzyMike Pharmacy - Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2c5282;
            --secondary-color: #38a169;
            --accent-color: #ed8936;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a365d 0%, #2c5282 50%, #1a365d 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        .card-main {
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            max-width: 480px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .card-header-custom {
            background: linear-gradient(135deg, #1a365d 0%, #2c5282 100%);
            padding: 2.5rem 2rem;
            text-align: center;
            border-bottom: 3px solid var(--accent-color);
        }
        .logo-icon {
            width: 70px;
            height: 70px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.2rem;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }
        .system-title {
            font-size: 1.75rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .system-subtitle {
            font-size: 0.9rem;
            opacity: 0.85;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .btn-admin {
            background: var(--primary-color);
            border: none;
            padding: 0.9rem 2rem;
            font-weight: 500;
            border-radius: 6px;
            transition: all 0.2s ease;
            font-size: 1rem;
        }
        .btn-admin:hover {
            background: #1a365d;
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(44, 82, 130, 0.4);
        }
        .feature-item {
            padding: 0.75rem 1rem;
            border-left: 3px solid var(--secondary-color);
            background: #f7fafc;
            margin-bottom: 0.5rem;
            border-radius: 0 6px 6px 0;
            font-size: 0.9rem;
        }
        .divider-text {
            display: flex;
            align-items: center;
            text-transform: uppercase;
            font-size: 0.7rem;
            letter-spacing: 1.5px;
            color: #a0aec0;
        }
        .divider-text::before,
        .divider-text::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e2e8f0;
        }
        .divider-text span {
            padding: 0 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card card-main">
                    <div class="card-header-custom text-white">
                        <div class="logo-icon">
                            <i class="bi bi-hospital text-white" style="font-size: 2rem;"></i>
                        </div>
                        <h1 class="system-title mb-2">LizzyMike Pharmacy</h1>
                        <p class="system-subtitle mb-0">Pharmacy Management System</p>
                    </div>
                    <div class="card-body p-4">
                        <div class="text-center mb-4">
                            <p class="text-muted mb-0" style="font-size: 0.9rem;">Authorized personnel only</p>
                        </div>
                        
                        <div class="d-grid gap-3">
                            <a href="/admin/login/?next=/admin/" class="btn btn-primary btn-admin btn-lg text-white">
                                <i class="bi bi-shield-lock me-2"></i>
                                Enter Admin Dashboard
                            </a>
                        </div>
                        
                        <div class="divider-text my-4">
                            <span>System Modules</span>
                        </div>
                        
                        <div class="feature-item">
                            <i class="bi bi-capsule me-2 text-primary"></i>
                            <strong>Inventory</strong> Management
                        </div>
                        <div class="feature-item">
                            <i class="bi bi-receipt text-success me-2"></i>
                            <strong>Sales</strong> & Invoicing
                        </div>
                        <div class="feature-item">
                            <i class="bi bi-people text-info me-2"></i>
                            <strong>Customer</strong> Records
                        </div>
                        <div class="feature-item">
                            <i class="bi bi-graph-up text-warning me-2"></i>
                            <strong>Analytics</strong> & Reports
                        </div>
                    </div>
                    <div class="card-footer bg-light text-center py-3" style="border-top: 1px solid #e2e8f0;">
                        <small class="text-muted">
                            <i class="bi bi-code-square me-1"></i> Powered by <strong>Kelorm DevTech Solutions</strong>
                        </small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
