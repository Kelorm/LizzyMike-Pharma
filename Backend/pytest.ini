[pytest]
# Pytest configuration for LizzyMike Pharmacy

# Django settings module
DJANGO_SETTINGS_MODULE = pharmasys.settings_consolidated

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = core/tests

# Add current directory to path
addopts =
    --strict-markers
    --tb=short
    --verbose
    -ra
    --cov=core
    --cov=pharmasys
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml
    --cov-branch
    --maxfail=1

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    auth: marks tests related to authentication
    sales: marks tests related to sales
    medications: marks tests related to medications
    security: marks tests related to security

# Randomly shuffle tests
randomly_seed = 12345

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning