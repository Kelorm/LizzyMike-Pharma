# LizzyMike Pharmacy System - LAN Nginx Configuration
# 
# This configuration is optimized for a local area network (LAN) deployment
# where a single Windows PC serves multiple client PCs inside a pharmacy.
#
# Server IP: 192.168.1.100
# Network: 192.168.1.x range
#
# Features:
# - Serves React frontend at root (/)
# - Proxies /api/ to Django backend
# - Restricts /admin/ to server PC only (192.168.1.100)
# - Handles media file uploads
# - Caches static assets for performance

server {
    listen 80;
    server_name 192.168.1.100 localhost;

    # =================================================================
    # REACT FRONTEND
    # =================================================================
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private must-revalidate auth;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype
        font/ttf
        font/eot
        font/otf;

    # Security headers (LAN-friendly)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # =================================================================
    # STATIC FILES (Django staticfiles shared volume)
    # =================================================================
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # =================================================================
    # MEDIA FILES (Uploads)
    # =================================================================
    location /media/ {
        alias /app/media/;
        # Allow file uploads up to 50MB
        client_max_body_size 50M;
        
        # Disable caching for media (uploads may change)
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # =================================================================
    # API PROXY TO DJANGO
    # =================================================================
    location /api/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts for long-running requests
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # =================================================================
    # ADMIN INTERFACE - SERVER PC ONLY
    # =================================================================
    location /admin/ {
        # Restrict to server PC only (192.168.1.100)
        # Change this IP if your server has a different address
        allow 192.168.1.100;
        allow 127.0.0.1;
        
        # Deny all other IPs
        deny all;
        
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =================================================================
    # HEALTH CHECK ENDPOINT
    # =================================================================
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # =================================================================
    # REACT ROUTER - Handle SPA routing
    # =================================================================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # =================================================================
    # ERROR PAGES
    # =================================================================
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}